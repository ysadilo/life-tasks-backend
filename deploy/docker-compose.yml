# Raspberry Pi deployment: Postgres + backend API. Image is built on the Pi.
# Frontend lives in its own repo/compose and joins the shared `life-tasks` network.
#   docker network create life-tasks   # once, before first `up`
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: life_tasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: life_tasks
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [life-tasks]

  backend:
    build:
      context: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://life_tasks:${POSTGRES_PASSWORD}@postgres:5432/life_tasks?schema=public
      NODE_ENV: production
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?set AUTH0_DOMAIN in .env}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?set AUTH0_AUDIENCE in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_FEEDBACK_REPO: ${GITHUB_FEEDBACK_REPO:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      AUTH0_LOGIN_CLIENT_ID: ${AUTH0_LOGIN_CLIENT_ID:-}
      AUTH0_LOGIN_CLIENT_SECRET: ${AUTH0_LOGIN_CLIENT_SECRET:-}
      APP_URL: ${APP_URL:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    depends_on: [postgres]
    networks: [life-tasks]

volumes:
  pgdata: {}

networks:
  life-tasks:
    external: true
